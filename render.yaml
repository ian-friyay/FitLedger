services:
  - type: web
    name: fitledger-preview
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /up
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: APP_TIMEZONE
        value: Asia/Manila
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        fromDatabase:
          name: fitledger-preview-db
          property: connectionString
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: sync
      - key: FILESYSTEM_DISK
        value: public
      - key: MAIL_MAILER
        value: resend
      - key: MAIL_FROM_ADDRESS
        value: no-reply@fitledger.com
      - key: MAIL_FROM_NAME
        value: FitLedger
      - key: RESEND_API_KEY
        sync: false
      - key: FITLEDGER_INITIAL_ADMIN_EMAIL
        value: admin@fitledger.com
      - key: FITLEDGER_INITIAL_ADMIN_PASSWORD
        sync: false
      - key: FITLEDGER_INITIAL_USER_EMAIL
        value: owner@fitledger.com
      - key: FITLEDGER_INITIAL_USER_PASSWORD
        sync: false

databases:
  - name: fitledger-preview-db
    databaseName: fitledger
    user: fitledger
    region: singapore
    plan: free
